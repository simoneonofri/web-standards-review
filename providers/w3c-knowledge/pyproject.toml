[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "w3c-knowledge"
version = "0.1.0"
description = "Versioned W3C knowledge service for specifications, reviews, provenance, and retrieval."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.13.2",
  "beautifulsoup4==4.12.3",
  "bleach==6.1.0",
  "fastapi==0.138.0",
  "httpx==0.28.1",
  "lxml==5.3.0",
  "psycopg[binary]==3.2.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
  "sqlalchemy==2.0.32",
  "typer==0.25.1",
  "uvicorn[standard]==0.49.0",
]

[project.optional-dependencies]
vectors = [
  "numpy==2.5.2",
  "onnxruntime==1.29.0",
  "tokenizers==0.23.2",
  "pgvector==0.5.0",
]
dev = [
  "mypy==1.11.1",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "respx==0.21.1",
  "ruff==0.6.2",
]

[project.scripts]
w3c-knowledge = "w3c_knowledge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["w3c_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: optional live-network tests disabled by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bleach", "bs4.*", "lxml", "lxml.*", "yaml"]
ignore_missing_imports = true
